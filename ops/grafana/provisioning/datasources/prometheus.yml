apiVersion: 1

# Grafana 启动时自动接上 Prometheus，不用手动点界面配。
# uid 固定成 prometheus，dashboard JSON 里就靠它引用数据源。
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
