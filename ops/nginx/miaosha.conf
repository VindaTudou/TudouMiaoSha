# 网关配置（实验 A′ / M2-C）
#
# __ROOT__ 会被 ops/nginx.sh 替换成仓库根目录，
# 这样日志、pid、临时目录都落在仓库内，不碰 /opt/homebrew（沙箱不允许写）。

# auto = 按 CPU 核数起 worker。写死 1 的话，4,000/s 时单个 worker 会成为瓶颈，
# 表现就是 p50 只涨 1ms、但 P99 涨了 20ms —— 那是我配置的问题，不是代理本身的成本。
worker_processes  auto;
error_log  __ROOT__/.runtime/nginx/error.log warn;
pid        __ROOT__/.runtime/nginx/nginx.pid;

events {
    worker_connections  4096;
}

http {
    # 关掉版本号，别把服务实现暴露给外面
    server_tokens off;

    access_log  __ROOT__/.runtime/nginx/access.log;

    client_body_temp_path  __ROOT__/.runtime/nginx/client_body;
    proxy_temp_path        __ROOT__/.runtime/nginx/proxy;
    fastcgi_temp_path      __ROOT__/.runtime/nginx/fastcgi;
    uwsgi_temp_path        __ROOT__/.runtime/nginx/uwsgi;
    scgi_temp_path         __ROOT__/.runtime/nginx/scgi;

    # keepalive 必须配：否则 nginx 到应用的每个请求都要重新三次握手，
    # 那样测出来的"代理开销"里混着连接建立成本，不是我们想量的东西。
    upstream miaosha {
        server 127.0.0.1:8080;
        keepalive 64;

        # 必须比 Tomcat 的空闲超时【短】。
        # 否则 nginx 会复用一个 Tomcat 已经关掉的连接 →
        # connect() failed (54: Connection reset by peer) → 502。
        # 实测：不配这条，67.5 万请求里冒出 176 个 502（0.026%）。
        keepalive_timeout 15s;
    }

    server {
        listen 127.0.0.1:8000;

        location / {
            proxy_http_version 1.1;      # keepalive 要求 1.1
            proxy_set_header Connection "";   # 清掉 close，才能复用连接
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://miaosha;
        }
    }
}
