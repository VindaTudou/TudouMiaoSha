server:
  port: 8080
  tomcat:
    # 【坑】不开这个，tomcat_threads_busy_threads 这条指标根本不存在。
    # Boot 3 为了省开销默认关掉 Tomcat 的 MBean 注册，而线程池指标是从 MBean 读的。
    # 结果就是：你以为监控在跑，其实最关心那条线一直是空白的。
    mbeanregistry:
      enabled: true
    threads:
      max: 200          # 压测时观察这个池子会不会被打满（threads.busy）
      min-spare: 20

spring:
  application:
    name: miaosha

  datasource:
    # 容器内用 mysql:3306；本机直跑默认连 3307（Docker 映射出来的端口）
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/miaosha?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: miaosha-pool
      # 故意设小：10 个连接足够把单行热点打满（V0.4 实测 4 线程就饱和）
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000    # 3 秒拿不到连接就报错，比默认 30 秒更快暴露问题
      max-lifetime: 1800000

  # ---------- V2：Redis 存库存 ----------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 2s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:16}
          max-idle: ${REDIS_POOL_MAX:8}
          min-idle: 2

  # ---------- V2：Kafka 异步落库 ----------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                   # 等所有 ISR 确认，最安全
      retries: 3
      properties:
        enable.idempotence: true  # 生产者幂等，避免重试导致重复
        linger.ms: ${KAFKA_LINGER_MS:5}   # 攒批等待；0 = 立刻发
        batch.size: 16384
    consumer:
      group-id: miaosha-order-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false   # 【关键】手动 ack：落库成功才提交位点
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 200
    listener:
      ack-mode: manual_immediate
      # 分区数是 3，所以最多 3 个消费者并行；设多了会空闲
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        # prometheus 这个端点就是 Prometheus 每 15 秒来拉的那张"数字清单"
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # 多实例时靠 app_instance 区分两台机器，否则两条线会粘在一起。
      # 不叫 instance 是因为 Prometheus 自己在抓取时会打一个 instance=host:port 标签，
      # 同名会被改名成 exported_instance，图上看着很别扭。
      application: miaosha
      app_instance: ${INSTANCE_ID:local}
    distribution:
      percentiles-histogram:
        # 导出直方图桶，Grafana 才能用 histogram_quantile 跨实例聚合算 P99
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99

logging:
  level:
    root: INFO

# ---------- 秒杀业务配置 ----------
miaosha:
  seckill-product-id: ${SECKILL_PRODUCT_ID:1}
  order-topic: seckill-order
