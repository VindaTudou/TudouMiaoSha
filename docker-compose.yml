# 秒杀项目 —— 最小可复现环境
#
# 设计约定（每个参数后面都写了为什么）：
#   1. name: miaosha —— 独立项目名，避免和机器上其它 compose 项目（如 doupilot）串味。
#      docker compose down 只删本项目的资源，不会误伤别人。
#   2. 数据用 named volume，不用 bind mount 到 ~/ 目录。
#      macOS 的文件共享层（VirtioFS）会让 MySQL 的随机写入慢一个量级，
#      V1 压测时你会把"文件共享开销"误判成"MySQL 瓶颈"。
#   3. 端口只绑 127.0.0.1，不暴露到局域网。
#   4. 密码写在默认值里，仅限本机学习用；真实项目走 .env + secret。

name: miaosha

services:
  mysql:
    image: mysql:8.4.5
    container_name: miaosha-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-miaosha}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    command:
      - --innodb-buffer-pool-size=512M
      # 保留默认值，先测再调。V1 压测时会回来改它，并记录改前改后的数字。
      - --max-connections=200
      # 行锁等待超时，默认 50 秒。V0.2 会被它卡住，正好体会一下。
      - --innodb-lock-wait-timeout=50
      # 慢查询阈值 200ms：任何超过它的语句都会被记进慢日志
      - --slow-query-log=1
      - --long-query-time=0.2
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据卷为空时执行一次（初始化脚本）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # 应用容器：默认不启动（当前网络拉不到 Docker Hub 镜像）。
  # 需要时：docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build:
      context: ./app
    image: miaosha-app:local
    container_name: miaosha-app
    restart: "no"
    environment:
      # 容器内用服务名 mysql，不是宿主机的 3307
      DB_URL: jdbc:mysql://mysql:3306/miaosha?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      TZ: Asia/Shanghai
      # 堆固定，避免 JVM 按宿主机内存算（容器只有 8G，宿主机 16G）
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx384m
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: miaosha-redis
    restart: "no"
    command:
      - redis-server
      # 开启 AOF：最多丢 1 秒数据。纯 RDB 会丢更多，秒杀库存不能这么赌
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      # 【关键】库存 key 绝不能被淘汰！noeviction 表示内存满了直接报错，
      # 而不是偷偷删掉数据。用 allkeys-lru 会导致库存 key 被删 → 超卖。
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:3.8.0
    container_name: miaosha-kafka
    restart: "no"
    environment:
      # 单节点 KRaft：broker 和 controller 在同一个进程里，不需要 ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 应用跑在宿主机，所以对外声明 127.0.0.1。
      # 如果以后把应用也容器化，这里要加一个内部 listener（如 kafka:29092）
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      # 单节点必须把副本因子设成 1，否则 topic 创建不了
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # 堆固定住，别让它跟 MySQL/Redis 抢内存
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
    name: miaosha-mysql-data
  redis-data:
    name: miaosha-redis-data
  kafka-data:
    name: miaosha-kafka-data
